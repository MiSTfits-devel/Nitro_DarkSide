# Headless nvc simulation pod for the NDS core.
# Driven by build/remote-sim.sh - it streams the source in with git archive
# (plus optionally uncommitted files with tar), so nothing needs pushing.
apiVersion: v1
kind: Pod
metadata:
  name: nds-nvc-sim
  labels:
    app: nds-nvc-sim
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/arch: amd64
  containers:
  - name: nvc
    image: ghcr.io/nickg/nvc:latest
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -u
        # /work is a REUSED per-pod PVC (see the volume below) - wipe the last
        # run's tree so a stale sim/tests hex or nvc_work library cannot make
        # this run disagree with a clean one
        rm -rf /work/src /work/exitcode
        mkdir -p /work/src
        echo "waiting for source (build/remote-sim.sh streams it in)..."
        while [ ! -f /work/src/.ready ]; do sleep 2; done
        cd /work/src
        SCRIPT=$(cat .script)
        echo "=== nvc $(nvc --version | head -1) : sim/${SCRIPT} ==="
        sh "sim/${SCRIPT}"
        rc=$?
        echo "=== sim finished, exit ${rc} ==="
        echo ${rc} > /work/exitcode
        # stay alive so the driver can fetch artifacts/logs
        sleep infinity
    resources:
      requests:
        # No cpu request on purpose: the node runs at ~98% of its cores
        # *requested* while most of those pods sit idle, so a 1-core request
        # made sims unschedulable for no real reason. With no request nvc is
        # best-effort on CPU - it still gets the idle cycles, and several sims
        # can queue up together. Memory is what actually needs reserving (the
        # full 64 MB card image alone is a few GB of nvc heap).
        memory: 2Gi
      limits:
        memory: 12Gi
    volumeMounts:
    - name: work
      mountPath: /work
  volumes:
  # /work had no volume at all, so it was the container's writable layer -
  # which containerd keeps under /var/lib/containerd on the node's 49.9 GB
  # /var, the same filesystem as every image. sim/tests alone streams in
  # ~200 MB of hex (kirby_full.hex is 151 MB by itself) and nvc work dirs
  # add more, all of it landing on the disk that evicts pods when it fills.
  # An ephemeral claim on `standard` (separate 899 GB device) keeps it clear.
  #
  # NAMED, not a generic ephemeral volume. A generic ephemeral claim was tried
  # first and MEASURED: one tb_gpu_obj run stranded a Released PV and 223.7 MB
  # on the big disk, because both StorageClasses are ReclaimPolicy=Retain and
  # nothing reclaims them. At the rate sims run here that fills 900 GB on its
  # own.
  #
  # The claim name carries the pod name, and remote-sim.sh already rewrites
  # `nds-nvc-sim` -> ${POD} throughout this file - so POD=nds-nvc-sim-2 gets
  # `nds-nvc-sim-2-work` automatically. Each parallel sim keeps its own RWO
  # claim (no deadlock), each is reused run to run (no accumulation), and the
  # pod wipes it at startup (no stale state).
  - name: work
    persistentVolumeClaim:
      claimName: nds-nvc-sim-work
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nds-nvc-sim-work
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi
