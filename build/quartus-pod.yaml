# SPDX-License-Identifier: GPL-2.0-or-later
# Headless Quartus 17.0 Lite build pod for the NDS core (GBA_MiSTer
# build/quartus-pod.yaml pattern). Driven by build/remote-build.sh - it
# streams the source in with git archive, so the branch never needs to be
# pushed anywhere.
apiVersion: v1
kind: Pod
metadata:
  name: nds-quartus-build
  labels:
    app: nds-quartus-build
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/arch: amd64
  containers:
  - name: quartus
    image: raetro/quartus:17.0
    # plain -c: a login shell would source /etc/profile and clobber the
    # image's PATH, which is where quartus_sh lives
    command: ["/bin/bash", "-c"]
    args:
      - |
        set -u
        # /work is a REUSED PVC (see the volume below), so the last build's
        # tree is still here. Clear it: a stale source file that files.qip no
        # longer lists, or a db/ from a different tree, is exactly the kind of
        # contamination that makes one build disagree with the next.
        rm -rf /work/src /work/exitcode
        mkdir -p /work/src
        echo "waiting for source (build/remote-build.sh streams it in)..."
        while [ ! -f /work/src/.ready ]; do sleep 2; done
        cd /work/src
        P=$(cat .parallel 2>/dev/null || echo 1)
        sed -i "s/NUM_PARALLEL_PROCESSORS 1/NUM_PARALLEL_PROCESSORS ${P}/" NDS.qsf
        echo "=== quartus_sh --flow compile NDS (parallel=${P}) ==="
        quartus_sh --flow compile NDS
        rc=$?
        echo "=== flow finished, exit ${rc} ==="
        cat "output_files/NDS.fit.summary" 2>/dev/null || true
        # detailed worst-path timing report (the default sta.rpt only has summaries)
        printf '%s\n' \
          "project_open NDS -revision NDS" \
          "create_timing_netlist" \
          "read_sdc" \
          "update_timing_netlist" \
          "report_timing -setup -npaths 50 -detail full_path -file output_files/NDS.paths.rpt" \
          "report_timing -setup -npaths 3000 -less_than_slack 14.92 -detail summary -file output_files/NDS.paths_67mhz.rpt" \
          "set a9 [get_registers {*icpu9*}]" \
          "set m9 [get_registers {*imembus9*}]" \
          "report_timing -setup -npaths 40 -detail summary -from \$a9 -to \$a9 -file output_files/NDS.paths_cpu9.rpt" \
          "report_timing -setup -npaths 40 -detail summary -from \$m9 -to \$m9 -append -file output_files/NDS.paths_cpu9.rpt" \
          "report_timing -setup -npaths 40 -detail summary -from \$a9 -to \$m9 -append -file output_files/NDS.paths_cpu9.rpt" \
          "report_timing -setup -npaths 40 -detail summary -from \$m9 -to \$a9 -append -file output_files/NDS.paths_cpu9.rpt" \
          "report_timing -setup -npaths 2 -detail full_path -from \$a9 -to \$a9 -file output_files/NDS.paths_fam.rpt" \
          "report_timing -setup -npaths 2 -detail full_path -from \$m9 -to \$m9 -append -file output_files/NDS.paths_fam.rpt" \
          "report_timing -setup -npaths 2 -detail full_path -from \$a9 -to \$m9 -append -file output_files/NDS.paths_fam.rpt" \
          "report_timing -setup -npaths 2 -detail full_path -from \$m9 -to \$a9 -append -file output_files/NDS.paths_fam.rpt" \
          "project_close" > paths.tcl
        quartus_sta -t paths.tcl || true
        echo ${rc} > /work/exitcode
        # stay alive so the driver can kubectl cp the artifacts out
        sleep infinity
    resources:
      requests:
        # cpu is compressible - reserve little, burst to the limit
        cpu: "1"
        memory: 8Gi
      limits:
        cpu: "12"
        memory: 24Gi
    volumeMounts:
    - name: work
      mountPath: /work
  volumes:
  - name: work
    persistentVolumeClaim:
      claimName: nds-quartus-work
---
# /work was an emptyDir, which lives under /var/lib/kubelet - i.e. on the
# node's 49.9 GB /var filesystem, the SAME one holding every container image.
# A Quartus fit writes the streamed tree plus db/, incremental_db/ and
# output_files/ there, several GB, on top of this image's own ~6 GB. On
# 2026-08-08 that combination evicted the build twice, and the second time
# took the node down to 0.4 GB free with the user's Matrix/cytube/minecraft
# pods on it.
#
# slacker has far bigger disks, they are just not where ephemeral storage
# goes - `standard` is /var/mnt/local-path-standard, a separate 899 GB
# device (dm-4) with ~625 GB free. Putting /work there takes the fitter's
# scratch off the pressured disk completely. The image pull still lands on
# /var; that part needs either headroom there or containerd moved.
#
# Deliberately a NAMED claim, not a generic ephemeral volume: both
# StorageClasses are ReclaimPolicy=Retain, so a per-pod ephemeral PVC would
# leave its directory behind on every single build and silently fill the big
# disk instead. One claim, reused, wiped at pod startup. It is RWO, so two
# concurrent builds cannot both mount it - which is fine, the node has no
# room to run two Quartus fits anyway.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nds-quartus-work
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 60Gi
