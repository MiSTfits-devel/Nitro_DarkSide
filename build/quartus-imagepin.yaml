# SPDX-License-Identifier: GPL-2.0-or-later
# Permanently pin raetro/quartus:17.0 in the node's image cache.
#
# WHY THIS EXISTS. slacker's /var is 49.9 GB and the Quartus image is 5.97 GB.
# kubelet's imageGCHighThresholdPercent defaults to 85, and /var sits at ~86%,
# so within minutes of a build finishing kubelet deletes the largest UNUSED
# image - which is always this one. The next build then re-pulls 6 GB, and the
# pull needs roughly double that at peak (compressed blobs + extraction). That
# spike is what trips `node.kubernetes.io/disk-pressure:NoSchedule`, and while
# the condition holds the kubelet evicts whatever is scheduled - the build
# itself, unrelated pods, even a 21 MB busybox. It happened twice on
# 2026-08-09 and once on 2026-08-08 (that time it took out the owner's cytube).
#
# kubelet will not garbage-collect an image that a RUNNING container
# references. So this Deployment does nothing but hold the reference. It costs
# no extra disk - the image is on the node either way - it only stops the
# delete/re-pull cycle. What it does cost is keeping /var at ~86% instead of
# letting it fall to ~70% when the image is collected, so if something else
# ever needs that headroom, scale this to 0 rather than wondering why /var is
# full.
#
#   kubectl apply -f build/quartus-imagepin.yaml     # pin
#   kubectl scale deploy/nds-quartus-imagepin --replicas=0   # temporarily release
#   kubectl delete -f build/quartus-imagepin.yaml    # unpin
#
# A Deployment rather than a bare Pod so it survives a node reboot or an
# eviction: after a reboot the image is cold and the first start pulls it once,
# which is the same one-time cost a build would pay anyway.
#
# The real fixes are growing /var (Talos VolumeConfig) or moving containerd's
# image store to /var/mnt/local-path-standard (899 GB). Both are machine-config
# changes; this is the cheap reversible stand-in.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nds-quartus-imagepin
  labels:
    app: nds-quartus-imagepin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nds-quartus-imagepin
  template:
    metadata:
      labels:
        app: nds-quartus-imagepin
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 1
      containers:
      - name: pin
        image: raetro/quartus:17.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c", "exec sleep infinity"]
        # Deliberately tiny: this container does no work, it only exists so the
        # image has a running referent. Requests this small also mean it never
        # competes with a real build for CPU.
        resources:
          requests:
            cpu: "10m"
            memory: 16Mi
          limits:
            memory: 64Mi
